<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B2A4A">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NetSight — Sign in</title>

  <script>
  (function () {
    var BUILD = '2026.11.26.4';
    var KEY = 'netsight_build';
    var seen = null;
    try { seen = localStorage.getItem(KEY); } catch (e) {}

    var stale = seen !== BUILD;
    try { localStorage.setItem(KEY, BUILD); } catch (e) {}

    var tasks = [];

    // Service workers are gone — unregister any left behind by an older build.
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
      tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function (r) { return r.length; }).catch(function () { return 0; }));
    }

    if (window.caches && caches.keys) {
      tasks.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).then(function () { return 0; }).catch(function () { return 0; }));
    }

    Promise.all(tasks).then(function (counts) {
      var removed = counts.some(function (n) { return n > 0; });
      if (stale || removed) location.reload();
    });
  })();
  </script>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/netsight-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=2026.11.26.4">

  <script src="js/config.js?v=2026.11.26.4"></script>
  <script src="js/theme.js?v=2026.11.26.4"></script>
</head>
<body data-page="login">

  <div id="toast-container" class="toast-container"></div>

  <main class="login">

    <header class="login__brand">
      <img src="assets/netsight-logo.svg" alt="" width="46" height="46" class="login__logo">
      <h1 class="login__title">NetSight</h1>
      <p class="login__tagline">Fishing gear reporting · Riga waterways</p>
    </header>

    <div class="login__card">

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" data-auth-tab="login" role="tab">
          Sign in
        </button>
        <button type="button" class="auth-tab" data-auth-tab="register" role="tab">
          Create account
        </button>
      </div>

      <!-- ---------------- LOGIN ---------------- -->
      <form id="form-login" class="auth-form" autocomplete="on" novalidate>
        <label class="field">
          <span class="field__label">Username</span>
          <input class="input" id="login-username" type="text" name="username"
                 autocomplete="username" spellcheck="false" autocapitalize="none"
                 placeholder="your username">
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <input class="input" id="login-password" type="password" name="password"
                 autocomplete="current-password" placeholder="••••••••">
        </label>

        <p class="auth-error" id="login-error" hidden></p>

        <button type="submit" class="btn btn--primary btn--lg btn--block" id="login-submit">
          Sign in
        </button>
      </form>

      <!-- ---------------- REGISTER ---------------- -->
      <form id="form-register" class="auth-form" autocomplete="on" novalidate hidden>
        <label class="field">
          <span class="field__label">Username</span>
          <input class="input" id="reg-username" type="text" name="username"
                 autocomplete="username" spellcheck="false" autocapitalize="none"
                 placeholder="3–24 characters">
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <input class="input" id="reg-password" type="password" name="new-password"
                 autocomplete="new-password" placeholder="at least 6 characters">
        </label>

        <label class="field">
          <span class="field__label">Repeat password</span>
          <input class="input" id="reg-password2" type="password" name="new-password"
                 autocomplete="new-password" placeholder="••••••••">
        </label>

        <p class="auth-hint">
          Letters and numbers, at least 6 characters. New accounts start as a
          normal user — an administrator can promote you to Water Patrol.
        </p>

        <p class="auth-error" id="reg-error" hidden></p>

        <button type="submit" class="btn btn--primary btn--lg btn--block" id="reg-submit">
          Create account
        </button>
      </form>

      <p class="auth-note" id="seed-note" hidden></p>

    </div>

    <footer class="login__footer">
      <button type="button" class="icon-btn icon-btn--ghost" data-theme-toggle aria-label="Theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </footer>

  </main>

  <script src="js/auth.js?v=2026.11.26.4"></script>
  <script>
  (function () {
    'use strict';

    const loginForm = document.getElementById('form-login');
    const registerForm = document.getElementById('form-register');
    const loginError = document.getElementById('login-error');
    const registerError = document.getElementById('reg-error');
    const seedNote = document.getElementById('seed-note');

    // ------------------------------------------------------------- tabs

    document.querySelectorAll('[data-auth-tab]').forEach(tab => {
      tab.addEventListener('click', () => {
        const target = tab.dataset.authTab;

        document.querySelectorAll('[data-auth-tab]').forEach(t => {
          t.classList.toggle('is-active', t.dataset.authTab === target);
        });

        loginForm.hidden = target !== 'login';
        registerForm.hidden = target !== 'register';

        say(loginError, '');
        say(registerError, '');

        const first = (target === 'login' ? loginForm : registerForm)
          .querySelector('input');
        if (first) first.focus();
      });
    });

    function say(el, message) {
      el.textContent = message;
      el.hidden = !message;
    }

    function busy(form, on) {
      const btn = form.querySelector('button[type="submit"]');
      if (btn) btn.disabled = on;
    }

    // ------------------------------------------------------------ login

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      say(loginError, '');

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      if (!username || !password) {
        say(loginError, 'Enter your username and password');
        return;
      }

      busy(loginForm, true);

      const result = await Auth.login(username, password);

      if (!result.ok) {
        busy(loginForm, false);
        say(loginError, result.message);
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
        return;
      }

      location.replace(Auth.pageFor(result.session.role));
    });

    // --------------------------------------------------------- register

    registerForm.addEventListener('submit', async e => {
      e.preventDefault();
      say(registerError, '');

      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-password2').value;

      if (!username || !password || !confirm) {
        say(registerError, 'Fill in all three fields');
        return;
      }

      busy(registerForm, true);

      const result = await Auth.register(username, password, confirm);

      if (!result.ok) {
        busy(registerForm, false);
        say(registerError, result.message);
        return;
      }

      location.replace(Auth.pageFor(result.session.role));
    });

    // ------------------------------------------------------------- boot

    (async function boot() {
      Theme.init();
      await Auth.seed();

      const existing = Auth.current();
      if (existing) {
        location.replace(Auth.pageFor(existing.role));
        return;
      }

      // Show the seeded administrator once, so the first run is not a dead end.
      const users = Auth.listUsers();
      const onlySeedAdmin = users.length === 1 && users[0].role === 'admin';

      if (onlySeedAdmin) {
        seedNote.hidden = false;
        seedNote.innerHTML =
          'First run — sign in as <b>admin</b> with password <b>admin123</b>, ' +
          'then change it in Admin → Security.';
      }

      document.getElementById('login-username').focus();
    })();
  })();
  </script>
</body>
</html>
